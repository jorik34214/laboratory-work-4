name: Program Code Convention

on: [push]

jobs:
  check-code-style:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify C# code style
        run: |
          dotnet format Шлях/До/ТвогоПроєкту.csproj --verify-no-changes --severity info || true
